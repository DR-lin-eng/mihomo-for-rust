name: Legacy Test
on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * 1'

jobs:
  go-compat-test:
    name: Go Compatibility
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      CGO_ENABLED: 0
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Verify Go installation
        run: go version

      - name: Compatibility tests
        run: go test ./... -v -count=1 -tags "legacy_go_runtime"
