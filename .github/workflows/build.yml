name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: "Tag version to release"
        required: true
  push:
    paths-ignore:
      - "docs/**"
      - "README.md"
      - ".github/ISSUE_TEMPLATE/**"
    branches:
      - Alpha
    tags:
      - "v*"
  pull_request:
    branches:
      - Alpha

concurrency:
  group: "${{ github.workflow }}-${{ github.ref }}"
  cancel-in-progress: true

env:
  REGISTRY: docker.io

jobs:
  rust-build:
    runs-on: ${{ matrix.jobs.runner }}
    strategy:
      matrix:
        jobs:
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, output: linux-amd64-v1, binary_name: mihomo, archive: gz, verify: test, smoke: shell }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, output: linux-amd64-v2, binary_name: mihomo, archive: gz, verify: test, rustflags: "-C target-cpu=x86-64-v2", smoke: shell }
          - { runner: ubuntu-latest, target: x86_64-unknown-linux-gnu, output: linux-amd64-v3, binary_name: mihomo, archive: gz, verify: test, rustflags: "-C target-cpu=x86-64-v3", smoke: shell }
          - { runner: ubuntu-24.04-arm, target: aarch64-unknown-linux-gnu, output: linux-arm64, binary_name: mihomo, archive: gz, verify: test, smoke: shell }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, output: darwin-amd64-v1, binary_name: mihomo, archive: gz, verify: test, smoke: shell }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, output: darwin-amd64-v2, binary_name: mihomo, archive: gz, verify: test, rustflags: "-C target-cpu=x86-64-v2", smoke: shell }
          - { runner: macos-26-intel, target: x86_64-apple-darwin, output: darwin-amd64-v3, binary_name: mihomo, archive: gz, verify: test, rustflags: "-C target-cpu=x86-64-v3", smoke: shell }
          - { runner: macos-latest, target: aarch64-apple-darwin, output: darwin-arm64, binary_name: mihomo, archive: gz, verify: test, smoke: shell }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, output: windows-amd64-v1, binary_name: mihomo.exe, archive: zip, verify: test, rustflags: "-C target-cpu=x86-64-v1", smoke: powershell }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, output: windows-amd64-v2, binary_name: mihomo.exe, archive: zip, verify: test, rustflags: "-C target-cpu=x86-64-v2", smoke: powershell }
          - { runner: windows-latest, target: x86_64-pc-windows-msvc, output: windows-amd64-v3, binary_name: mihomo.exe, archive: zip, verify: test, smoke: powershell }
    steps:
      - uses: actions/checkout@v6

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          profile: minimal
          targets: ${{ matrix.jobs.target }}

      - name: Verify Rust installation
        run: rustc --version && cargo --version

      - name: Set variables
        run: |
          VERSION="${GITHUB_REF_NAME,,}-$(git rev-parse --short HEAD)"
          VERSION="${VERSION//\//-}"
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION=${{ github.event.inputs.version }}
          fi
          echo "VERSION=${VERSION}" >> $GITHUB_ENV

      - name: Compile Rust tests
        if: ${{ matrix.jobs.verify == 'test' }}
        run: cargo test --manifest-path rust/Cargo.toml --workspace --no-run

      - name: Build Rust binary
        env:
          RUSTFLAGS: ${{ matrix.jobs.rustflags }}
        run: cargo build --manifest-path rust/Cargo.toml -p mihomo-app --bin mihomo --release --target ${{ matrix.jobs.target }}

      - name: Set up Go for shim smoke
        if: ${{ matrix.jobs.output == 'linux-amd64-v1' }}
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c
        with:
          go-download-base-url: 'https://github.com/MetaCubeX/go/releases/download/build'
          go-version: '1.26'

      - name: Smoke test Go shim handoff to Rust
        if: ${{ matrix.jobs.output == 'linux-amd64-v1' }}
        env:
          GOCACHE: ${{ runner.temp }}/go-build
          GOMODCACHE: ${{ runner.temp }}/go-mod
          MIHOMO_RUST_BINARY: ${{ github.workspace }}/rust/target/${{ matrix.jobs.target }}/release/${{ matrix.jobs.binary_name }}
        run: |
          go build -o mihomo-go-shim .
          ./mihomo-go-shim -v

      - name: Smoke test Rust binary
        if: ${{ matrix.jobs.smoke == 'shell' }}
        run: |
          rust/target/${{ matrix.jobs.target }}/release/${{ matrix.jobs.binary_name }} -v

      - name: Smoke test Rust binary on Windows
        if: ${{ matrix.jobs.smoke == 'powershell' }}
        shell: pwsh
        run: |
          & "rust/target/${{ matrix.jobs.target }}/release/${{ matrix.jobs.binary_name }}" -v

      - name: Package Rust artifact
        if: ${{ matrix.jobs.archive == 'gz' }}
        run: |
          cp rust/target/${{ matrix.jobs.target }}/release/${{ matrix.jobs.binary_name }} mihomo-${{ matrix.jobs.output }}
          gzip -c mihomo-${{ matrix.jobs.output }} > mihomo-${{ matrix.jobs.output }}-${VERSION}.gz
          rm mihomo-${{ matrix.jobs.output }}
          echo ${VERSION} > version.txt

      - name: Package Rust artifact zip
        if: ${{ matrix.jobs.archive == 'zip' }}
        shell: pwsh
        run: |
          Copy-Item "rust/target/${{ matrix.jobs.target }}/release/${{ matrix.jobs.binary_name }}" "mihomo-${{ matrix.jobs.output }}.exe"
          Compress-Archive -Path "mihomo-${{ matrix.jobs.output }}.exe" -DestinationPath "mihomo-${{ matrix.jobs.output }}-${env:VERSION}.zip" -Force
          Remove-Item "mihomo-${{ matrix.jobs.output }}.exe"
          Set-Content -Path version.txt -Value $env:VERSION

      - name: Archive Rust artifacts
        uses: actions/upload-artifact@v7
        with:
          name: "rust-${{ matrix.jobs.output }}"
          path: |
            mihomo-${{ matrix.jobs.output }}-*.gz
            mihomo-${{ matrix.jobs.output }}-*.zip
            version.txt

  upload-prerelease:
    permissions: write-all
    if: ${{ github.event_name != 'workflow_dispatch' && github.ref_type == 'branch' && !startsWith(github.event_name, 'pull_request') }}
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Download workflow artifacts
        uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Calculate checksums
        run: |
          cd bin/
          find . -type f -not -name "checksums.*" -not -name "version.txt" | sort | xargs sha256sum > checksums.txt
          cat checksums.txt
        shell: bash

      - name: Delete current release assets
        uses: 8Mi-Tech/delete-release-assets-action@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          tag: Prerelease-${{ github.ref_name }}
          deleteOnlyFromDrafts: false

      - name: Set Env
        run: |
          echo "BUILDTIME=$(TZ=Asia/Shanghai date)" >> $GITHUB_ENV
        shell: bash

      - name: Tag Repo
        uses: richardsimko/update-tag@v1
        with:
          tag_name: Prerelease-${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: |
          cat > release.txt << 'EOF'
          Release created at  ${{ env.BUILDTIME }}
          Synchronize ${{ github.ref_name }} branch code updates, keeping only the latest version
          <br>
          [我应该下载哪个文件? / Which file should I download?](https://github.com/MetaCubeX/mihomo/wiki/FAQ)
          [二进制文件筛选 / Binary file selector](https://metacubex.github.io/Meta-Docs/startup/#_1)
          [查看文档 / Docs](https://metacubex.github.io/Meta-Docs/)
          EOF

      - name: Upload Prerelease
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: Prerelease-${{ github.ref_name }}
          files: |
            bin/*
          prerelease: true
          generate_release_notes: true
          body_path: release.txt

  upload-release:
    permissions: write-all
    if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: Meta
          fetch-depth: '0'
          fetch-tags: 'true'

      - name: Get tags
        run: |
          echo "CURRENTVERSION=${{ github.event.inputs.version }}" >> $GITHUB_ENV
          git fetch --tags
          echo "PREVERSION=$(git describe --tags --abbrev=0 HEAD)" >> $GITHUB_ENV

      - name: Force push Alpha branch to Meta
        run: |
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global user.name "github-actions[bot]"
          git fetch origin Alpha:Alpha
          git push origin Alpha:Meta --force
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag the commit on Alpha
        run: |
          git checkout Alpha
          git tag ${{ github.event.inputs.version }}
          git push origin ${{ github.event.inputs.version }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate release notes
        run: |
          cp ./.github/genReleaseNote.sh ./
          bash ./genReleaseNote.sh -v ${PREVERSION}...${CURRENTVERSION}
          rm ./genReleaseNote.sh

      - uses: actions/download-artifact@v8
        with:
          path: bin/
          merge-multiple: true

      - name: Display structure of downloaded files
        run: ls -R
        working-directory: bin

      - name: Upload Release
        uses: softprops/action-gh-release@v3
        if: ${{ success() }}
        with:
          tag_name: ${{ github.event.inputs.version }}
          files: bin/*
          body_path: release.md

  docker:
    if: ${{ !startsWith(github.event_name, 'pull_request') }}
    permissions: write-all
    needs: [rust-build]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v4
        with:
          version: latest

      - name: Extract Docker metadata
        if: ${{ github.event_name != 'workflow_dispatch' }}
        id: meta_alpha
        uses: docker/metadata-action@v6
        with:
          images: '${{ env.REGISTRY }}/${{ github.repository }}'

      - name: Extract Docker metadata
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        id: meta_release
        uses: docker/metadata-action@v6
        with:
          images: '${{ env.REGISTRY }}/${{ github.repository }}'
          tags: |
            ${{ github.event.inputs.version }}
          flavor: |
            latest=true
          labels: org.opencontainers.image.version=${{ github.event.inputs.version }}

      - name: Login to docker REGISTRY
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ secrets.DOCKER_HUB_USER }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Build and push Docker image
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta_alpha.outputs.tags }}
          labels: ${{ steps.meta_alpha.outputs.labels }}

      - name: Build and push Docker image
        if: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.version != '' }}
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          platforms: |
            linux/amd64
            linux/arm64
          tags: ${{ steps.meta_release.outputs.tags }}
          labels: ${{ steps.meta_release.outputs.labels }}
