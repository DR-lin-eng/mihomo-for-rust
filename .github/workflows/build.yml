name: Build
on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version
        required: true
permissions:
  contents: read
jobs:
  macos-arm64:
    name: Build macOS ARM64 on Intel
    runs-on: macos-26-intel
    timeout-minutes: 60
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
      CARGO_PROFILE_RELEASE_STRIP: symbols
      MACOSX_DEPLOYMENT_TARGET: "11.0"
    steps:
      - uses: actions/checkout@v6
        with:
          ref: d8fe7e84559f92d9b6124e28a8d1db20fe99594f
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.88.0
          targets: aarch64-apple-darwin
      - name: Configure version and SDK
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          [[ "$INPUT_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || exit 1
          echo "MIHOMO_VERSION=$INPUT_VERSION" >> "$GITHUB_ENV"
          echo "MIHOMO_BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_ENV"
          echo "SDKROOT=$(xcrun --sdk macosx --show-sdk-path)" >> "$GITHUB_ENV"
      - name: Build ARM64 kernel
        run: cargo build --manifest-path rust/Cargo.toml --locked --release --target aarch64-apple-darwin -p mihomo-app --bin mihomo
      - name: Verify architecture and package
        shell: bash
        run: |
          CORE=rust/target/aarch64-apple-darwin/release/mihomo
          file "$CORE"
          test "$(lipo -archs "$CORE")" = arm64
          otool -L "$CORE"
          gzip -n -c "$CORE" > "mihomo-darwin-arm64-${MIHOMO_VERSION}.gz"
          printf '%s\n' "$MIHOMO_VERSION" > version.txt
          git rev-parse HEAD > commit.txt
          test "$(cat commit.txt)" = d8fe7e84559f92d9b6124e28a8d1db20fe99594f
      - uses: actions/upload-artifact@v7
        with:
          name: rust-darwin-arm64
          path: |
            mihomo-darwin-arm64-*.gz
            version.txt
            commit.txt
          if-no-files-found: error
