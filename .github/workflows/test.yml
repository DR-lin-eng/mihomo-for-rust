name: Test
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust-test:
    name: Rust Workspace
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container:
      image: rust:1.88
      options: --privileged
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    defaults:
      run:
        shell: bash
        working-directory: rust
    steps:
      - uses: actions/checkout@v6

      - name: Install test runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.100

      - name: Verify Rust installation
        run: rustc --version && cargo --version

      - name: Test workspace in isolated processes
        run: cargo nextest run --workspace --locked --profile ci

      - name: Upload test results
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: workspace-test-results
          path: rust/target/nextest/ci/junit.xml
          if-no-files-found: warn
