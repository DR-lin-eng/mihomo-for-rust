[package]
name = "mihomo-transport"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = ["ssh-transport"]
ssh-transport = ["dep:ssh2"]
ssh-transport-tests = ["ssh-transport", "dep:russh", "dep:ssh-key"]

[dependencies]
aes = "0.8"
aes-gcm = "0.10"
argon2 = "0.5"
base64 = "0.22"
blake2 = "0.10"
blake3 = "1"
bytes = "1"
chacha20poly1305 = "0.10"
cfb-mode = "0.8"
crc32fast = "1"
ctr = "0.9"
curve25519-dalek = "=4.0.0-rc.3"
ed25519-dalek = { version = "=2.0.0-rc.3", default-features = false, features = ["fast", "std"] }
ml-kem = "=0.3.0-rc.1"
x25519-dalek = { version = "=2.0.0-rc.3", features = ["static_secrets"] }
h2 = "0.4"
h3 = "0.0.8"
h3-quinn = "0.0.10"
hex = "0.4"
hmac = "0.12"
hkdf = "0.12"
hysteria2 = "0.1.6"
http = "1"
ipnet = "2"
md-5 = "0.10"
mihomo-core = { path = "../mihomo-core" }
mihomo-dns = { path = "../mihomo-dns" }
quinn = { version = "0.11.9", default-features = false, features = ["runtime-tokio", "rustls-aws-lc-rs", "log", "platform-verifier"] }
quinn-udp = "0.5.14"
rand = "0.8"
rcgen = "0.13"
rustls = { version = "0.21", features = ["dangerous_configuration"] }
rustls023 = { package = "rustls", version = "0.23.32", features = ["aws_lc_rs"] }
rustls-native-certs = "0.6"
rustls-pemfile = "1"
x509-parser = "0.18"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
socket2 = "0.6"
russh = { version = "0.60.3", optional = true }
sha1 = "0.10"
sha2 = "0.10"
sha3 = "0.10"
ssh2 = { version = "0.9.5", features = ["vendored-openssl"], optional = true }
ssh-key = { version = "0.6", optional = true }
smoltcp = { version = "0.11.0", default-features = false, features = ["std", "medium-ip", "proto-ipv4", "proto-ipv6", "socket-tcp", "socket-udp", "async"] }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "sync", "io-util", "macros", "net"] }
tokio-rustls = "0.24"
tokio-wireguard = "0.1.3"
uuid = "1"
webpki-roots = "0.25"

[dev-dependencies]
rand_010 = { package = "rand", version = "0.10" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "io-util", "time"] }

[target.'cfg(any(target_os = "linux", target_os = "android"))'.dependencies]
libc = "0.2"

[lib]
path = "src/lib.rs"
