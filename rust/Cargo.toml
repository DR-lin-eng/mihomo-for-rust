[workspace]
members = [
    "crates/mihomo-api",
    "crates/mihomo-app",
    "crates/mihomo-buf",
    "crates/mihomo-config",
    "crates/mihomo-core",
    "crates/mihomo-dns",
    "crates/mihomo-ebpf",
    "crates/mihomo-inbound",
    "crates/mihomo-outbound",
    "crates/mihomo-platform",
    "crates/mihomo-rules",
    "crates/mihomo-runtime",
    "crates/mihomo-transport",
    "crates/mihomo-tun",
]
resolver = "2"
exclude = ["third-party/aya"]

[workspace.package]
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/MetaCubeX/mihomo"
version = "0.1.0"

# Fixed Aya 0.13.1 with one additive constructor for TC programs without CO-RE.
[patch.crates-io]
aya = { path = "third-party/aya" }
